name: Release unsigned IPA

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project Island.xcodeproj \
            -scheme Island \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Island.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/Island.xcarchive/Products/Applications/Island.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "Island-${GITHUB_REF_NAME}-unsigned.ipa" Payload

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Island ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/Island-${{ github.ref_name }}-unsigned.ipa
