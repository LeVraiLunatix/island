name: build-ipa
on:
  push:
    branches: [main, "27.0.1-support"]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls /Applications | grep -i xcode

      - name: Select Xcode 26
        run: |
          # pick le plus récent Xcode_26* dispo
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n1)
            echo "WARN: pas de Xcode 26, fallback: $XCODE"
          fi
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project Island.xcodeproj \
            -scheme Island \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Island.app Payload/
          zip -r Island.ipa Payload
          ls -la Island.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Island-unsigned
          path: Island.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Island.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
